name: Build Windows EXE

on:
  workflow_dispatch:        # GitHub par "Run workflow" button se chalta hai
  push:
    tags: ["v*"]            # tag (jaise v1.0) push karne par bhi chalega

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item "ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" "ffmpeg\ffmpeg.exe"

      - name: Make icon from logo
        run: python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32)])"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --name DarkClipMaker --icon logo.ico `
            --add-data "app.py;." --add-data "logo.png;." `
            --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" `
            --collect-all streamlit --copy-metadata streamlit `
            --collect-all faster_whisper --collect-all ctranslate2 `
            --collect-all onnxruntime --collect-all av --collect-all tokenizers `
            --collect-data cv2 `
            launcher.py

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist\DarkClipMaker -DestinationPath DarkClipMaker-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DarkClipMaker-Windows
          path: DarkClipMaker-Windows.zip

      - name: Publish release (sirf tag par)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DarkClipMaker-Windows.zip
